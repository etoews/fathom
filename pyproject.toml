[project]
name = "fathom"
version = "0.1.0"
description = "Pulls the best frames from scuba diving videos using cheap heuristics, with a local web UI for review and curation."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Everett Toews", email = "everett.toews@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.6",
    "rich>=15.0.0",
]

[project.scripts]
fathom = "fathom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.28",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ty.src]
include = ["src"]
